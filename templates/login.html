<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyBase — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 48px 44px 40px;
      width: 100%;
      max-width: 400px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      font-size: 40px;
      display: block;
      margin-bottom: 8px;
    }
    .logo h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1F3864;
      letter-spacing: 1px;
    }
    .logo p {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 18px;
    }
    .alert-error   { background: #fdecea; color: #c0392b; border-left: 4px solid #c0392b; }
    .alert-success { background: #eafaf1; color: #1e8449; border-left: 4px solid #1e8449; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
      font-size: 15px;
      color: #222;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 18px;
    }
    input:focus { border-color: #2E5E9E; }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: #1F3864;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.5px;
    }
    button[type="submit"]:hover { background: #2E5E9E; }

    .hint {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <span class="logo-icon">✈</span>
      <h1>SkyBase</h1>
      <p>Airline Management System</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username"
             placeholder="Enter your username" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             placeholder="Enter your password" required>

      <button type="submit">Sign In</button>
    </form>

    <p class="hint">Diamond Group Staff Portal &mdash; Authorised Access Only</p>
  </div>
</body>
</html>
