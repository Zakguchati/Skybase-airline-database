{% extends "base.html" %}
{% block title %}New Booking{% endblock %}
{% block content %}

<div class="page-header">
  <h1>Create New Booking</h1>
</div>

<div class="card">
  <div class="card-header">
    <h2>New Passenger Booking</h2>
    <a href="{{ url_for('bookings') }}" class="btn btn-sm">← Back to Bookings</a>
  </div>
  <div style="padding:24px">
    <form method="POST">
      <div class="form-row">
        <div class="form-group">
          <label>Passenger *</label>
          <select name="passenger_id" required>
            <option value="">-- Select Passenger --</option>
            {% for p in passengers %}
            <option value="{{ p.passenger_id }}">{{ p.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Flight *</label>
          <select name="flight_id" required>
            <option value="">-- Select Flight --</option>
            {% for f in flights %}
            <option value="{{ f.flight_id }}">{{ f.label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Seat Class *</label>
          <select name="seat_class" required>
            <option value="Economy">Economy</option>
            <option value="Business">Business</option>
            <option value="First">First Class</option>
          </select>
        </div>
        <div class="form-group">
          <label>Payment Amount (£) *</label>
          <input type="number" name="amount" step="0.01" min="0" required placeholder="e.g. 450.00">
        </div>
        <div class="form-group">
          <label>Payment Method *</label>
          <select name="payment_method" required>
            <option value="Credit Card">Credit Card</option>
            <option value="Debit Card">Debit Card</option>
            <option value="PayPal">PayPal</option>
            <option value="Bank Transfer">Bank Transfer</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">📋 Create Booking</button>
    </form>
  </div>
</div>

{% endblock %}
